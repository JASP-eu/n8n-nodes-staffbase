# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade:
#
#   npm install --save-dev @n8n/node-cli@latest
#
# ─── AUTHENTICATION ────────────────────────────────────────────────────────────
#
# npm trusted publishing (OIDC) only, no NPM_TOKEN secret. npmjs.com → package
# n8n-nodes-staffbase → Settings → Trusted Publisher: JASP-eu/n8n-nodes-staffbase,
# workflow publish.yml, "npm publish" allowed. Needs npm ≥ 11.5.1 (Node 24 ships it).
# Why no token path: decisions.md, 2026-11-12.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Raise "version" in package.json and CHANGELOG.md in a PR, merge it, then tag
# the merge commit with the same version and push the tag. Do not use the local
# `npm run release` (release-it): it commits and pushes to main directly.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    # GitHub-hosted on purpose: npm trusted publishing and provenance reject
    # self-hosted runners (decisions.md, 2026-11-12).
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # isolated-vm (via @n8n/node-cli) does not compile on Node 26 yet.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # n8n-node release runs lint, build and `npm publish` with provenance in CI.
        run: npm run release
